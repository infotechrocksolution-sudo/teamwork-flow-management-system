name: Validate app source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: php -l api.php
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check inline JavaScript syntax
        run: |
          node --input-type=commonjs -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const start=html.indexOf('<script>');const end=html.indexOf('</script>',start);if(start<0||end<0)throw new Error('Inline script not found');new Function(html.slice(start+8,end));console.log('Inline JavaScript syntax OK')"
